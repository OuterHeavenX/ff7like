name: build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  GODOT_VERSION: 4.4.1
  PAGES_SOURCE_BRANCH: claude/echoes-of-the-last-dawn
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }} + export templates
        run: |
          set -e
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q godot.zip && sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl && mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
      - name: Build, test, export, package
        run: bash tools/build.sh
      - name: Traversal harness
        run: godot --headless -- --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: echoes-packages
          path: dist/packages/
      - uses: actions/upload-artifact@v4
        with:
          name: echoes-web
          path: |
            dist/web/
            !dist/web/**/*.import
          include-hidden-files: false

  # Publishes the tested Web build to the gh-pages branch (GitHub Pages source)
  # on every push to the main development branch. Never force-pushes.
  deploy-pages:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'claude/echoes-of-the-last-dawn'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: echoes-web
          path: web
      - name: Replace site contents with the new build
        run: |
          set -e
          test -f web/index.html && test -f web/index.wasm && test -f web/index.pck
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r web/. site/
          touch site/.nojekyll
          find site -name '*.import' -delete
      - name: Commit and push to gh-pages
        working-directory: site
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to deploy."
            exit 0
          fi
          git commit -m "Deploy web build from ${GITHUB_SHA::7}"
          git push origin gh-pages

  # Publishes the tested packages to itch.io with butler once the owner adds a
  # repository secret BUTLER_API_KEY and a repository variable ITCH_TARGET
  # (<itch-user>/<game-slug>). Without both it logs a notice and uploads nothing.
  deploy-itch:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'claude/echoes-of-the-last-dawn'
    runs-on: ubuntu-22.04
    concurrency:
      group: itch-deploy
      cancel-in-progress: false
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET }}
    steps:
      - name: Check itch.io configuration
        id: cfg
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo "::notice::itch.io upload skipped: add the BUTLER_API_KEY secret and the ITCH_TARGET variable to enable it (see docs/RELEASE.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: echoes-packages
          path: packages
      - name: Push web + Linux builds with butler
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -e
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          WEB=$(ls packages/echoes-of-the-last-dawn-*-web.zip)
          V=$(basename "$WEB" | sed -E 's/^echoes-of-the-last-dawn-(.*)-web\.zip$/\1/')
          ./butler/butler push "$WEB" "$ITCH_TARGET:html5" --userversion "$V"
          ./butler/butler push "packages/echoes-of-the-last-dawn-$V-linux-x86_64.zip" "$ITCH_TARGET:linux" --userversion "$V"
